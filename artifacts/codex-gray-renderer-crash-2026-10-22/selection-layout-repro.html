<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
		<title>Native selection and scroll animation fixture</title>
		<style>
			body {
				margin: 24px;
				font: 16px sans-serif;
			}
			.repro-scroller {
				width: 360px;
				height: 128px;
				overflow: auto;
				animation: fixture-fade linear both;
				animation-timeline: scroll(self y);
			}
			.repro-content {
				height: 384px;
				background: #ccc;
			}
			@keyframes fixture-fade {
				from {
					opacity: 0.4;
				}
				to {
					opacity: 1;
				}
			}
		</style>
	</head>
	<body>
		<p id="selection">Selected fixture text stays outside the two scroll containers.</p>
		<button id="swap" type="button">Swap scroll containers</button>
		<div class="repro-scroller"><div class="repro-content">First fixture container</div></div>
		<div class="repro-scroller" style="display: none">
			<div class="repro-content">Second fixture container</div>
		</div>
		<script>
			// Isolates the conditions reported at https://github.com/openai/codex/issues/44322.
			const variant = new URLSearchParams(location.search).get("case") ?? "full"
			const scrollers = [...document.querySelectorAll(".repro-scroller")]
			if (variant === "no-animation") {
				for (const scroller of scrollers) scroller.style.animation = "none"
			}
			if (variant === "normal-timeline") {
				for (const scroller of scrollers) scroller.style.animationTimeline = "auto"
			}
			if (variant !== "no-selection") {
				const text = document.getElementById("selection").firstChild
				const range = document.createRange()
				range.setStart(text, 0)
				range.setEnd(text, 18)
				getSelection().addRange(range)
			}
			window.__nativeLayoutRepro = { variant, clicks: 0 }
			document.getElementById("swap").addEventListener("click", () => {
				window.__nativeLayoutRepro.clicks++
				if (variant === "no-toggle") return
				for (const scroller of scrollers) {
					scroller.style.display = scroller.style.display === "none" ? "block" : "none"
				}
			})
		</script>
	</body>
</html>
