name: "Setup Node.js and pnpm"

description: "Sets up Node.js and pnpm with caching and installs dependencies"

inputs:
    node-version:
        description: "Node.js version to use"
        required: false
        default: "24.14.1"
    npm-version:
        description: "npm version to use"
        required: false
        default: "11.11.0"
    pnpm-version:
        description: "pnpm version to use"
        required: false
        default: "11.24.0"
    registry-url:
        description: "Optional package registry URL for actions/setup-node authentication"
        required: false
        default: ""
    scope:
        description: "Optional package scope for actions/setup-node authentication"
        required: false
        default: ""
    skip-install:
        description: "Skip dependency installation"
        required: false
        default: "false"
    install-args:
        description: "Additional arguments for pnpm install"
        required: false
        default: ""

runs:
    using: "composite"
    steps:
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
              node-version: ${{ inputs.node-version }}
              registry-url: ${{ inputs.registry-url }}
              scope: ${{ inputs.scope }}
        - name: Install exact npm
          shell: bash
          run: npm install --global "npm@${{ inputs.npm-version }}"
        - name: Install pnpm
          uses: pnpm/action-setup@v4
          with:
              version: ${{ inputs.pnpm-version }}
        - name: Verify toolchain
          shell: bash
          run: |
              test "$(node --version)" = "v${{ inputs.node-version }}"
              test "$(npm --version)" = "${{ inputs.npm-version }}"
              test "$(pnpm --version)" = "${{ inputs.pnpm-version }}"
        - name: Get pnpm store directory
          shell: bash
          run: |
              echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
        - name: Setup pnpm cache
          uses: actions/cache@v4
          with:
              path: ${{ env.STORE_PATH }}
              key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
              restore-keys: |
                  ${{ runner.os }}-pnpm-store-
        - name: Install dependencies
          if: ${{ inputs.skip-install != 'true' }}
          shell: bash
          run: pnpm install --frozen-lockfile ${{ inputs.install-args }}
        - name: Restore bundled ripgrep executable
          if: ${{ inputs.skip-install != 'true' }}
          shell: bash
          run: pnpm --dir src rebuild @vscode/ripgrep
