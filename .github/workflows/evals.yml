name: Evals

on:
    pull_request:
        types: [labeled]
    workflow_dispatch:

env:
    DOCKER_BUILDKIT: 1
    COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
    evals:
        # Run if triggered manually or if PR has 'evals' label.
        if: github.event_name == 'workflow_dispatch' || contains(github.event.label.name, 'evals')
        runs-on: blacksmith-16vcpu-ubuntu-2404
        timeout-minutes: 45

        defaults:
            run:
                working-directory: packages/evals

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup pinned local toolchain
              uses: ./.github/actions/setup-node-pnpm

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Create environment
              run: |
                  cat > .env.local << EOF
                  OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY || 'test-key-for-build' }}
                  EOF

                  cat > .env.development << EOF
                  NODE_ENV=development
                  DATABASE_URL=postgresql://postgres:password@db:5432/evals_development
                  REDIS_URL=redis://redis:6379
                  HOST_EXECUTION_METHOD=docker
                  EOF

            - name: Build, start, check and migrate through the local interface
              run: pnpm docker:prepare

            - name: Run evals
              run: pnpm docker:campaign

            - name: Cleanup
              if: always()
              run: pnpm docker:stop
