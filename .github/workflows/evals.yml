name: OpenAI coding evaluation campaign

on:
    pull_request:
        types: [opened, reopened, ready_for_review, labeled, synchronize]
    workflow_dispatch:

permissions:
    contents: read

env:
    DOCKER_BUILDKIT: 1
    COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
    evals:
        # Keep the label's campaign current without dispatching again for unrelated label changes.
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (contains(github.event.pull_request.labels.*.name, 'evals') &&
            (github.event.action != 'labeled' || github.event.label.name == 'evals'))
        runs-on: blacksmith-16vcpu-ubuntu-2404
        timeout-minutes: 45

        defaults:
            run:
                working-directory: packages/evals

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Setup pinned local toolchain
              uses: ./.github/actions/setup-node-pnpm

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Create environment
              env:
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
                  OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
                  EVALS_MODEL_ID: ${{ vars.EVALS_MODEL_ID || 'gpt-4.1' }}
              run: |
                  node --input-type=module <<'NODE'
                  import { writeFileSync } from "node:fs"
                  if (!process.env.OPENAI_API_KEY?.trim()) {
                    console.error("An OpenAI credential is required for this explicitly selected coding campaign.")
                    process.exit(1)
                  }
                  const names = ["OPENAI_API_KEY", "OPENAI_BASE_URL", "EVALS_MODEL_ID"]
                  writeFileSync(".env.local", names.map((name) => `${name}=${JSON.stringify(process.env[name])}`).join("\n") + "\n", { mode: 0o600 })
                  NODE

                  cat > .env.development << EOF
                  NODE_ENV=development
                  DATABASE_URL=postgresql://postgres:password@db:5432/evals_development
                  REDIS_URL=redis://redis:6379
                  HOST_EXECUTION_METHOD=docker
                  EOF

            - name: Build, start, check and migrate through the local interface
              run: pnpm docker:prepare

            - name: Run evals
              run: pnpm docker:campaign

            - name: Cleanup
              if: always()
              run: pnpm docker:stop

            - name: Remove the campaign credential file
              if: always()
              run: |
                  node -e "require('node:fs').rmSync('.env.local', { force: true })"
