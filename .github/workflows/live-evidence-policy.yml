name: Import existing live Copilot evidence

on:
    workflow_dispatch:
        inputs:
            evidence_run_id:
                description: Run containing the reviewed alpha-live-copilot-evidence artifact
                required: true
                type: string
            model_id:
                description: Exact expected Copilot model ID
                required: true
                type: string
            effort:
                description: Exact expected reasoning effort
                required: true
                type: string

permissions:
    contents: read
    actions: read

jobs:
    live-evidence-admission:
        runs-on: windows-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup-node-pnpm
            - name: Build the current workspace types
              run: pnpm --filter @alpha-code/types build
            - name: Build the current extension
              run: pnpm bundle
            - name: Build the current webview
              run: pnpm --filter @alpha-code/vscode-webview build
            - name: Compile the current host harness
              run: pnpm --dir apps/vscode-e2e compile
            - name: Materialize the fixed sidecar manifest for build comparison
              run: node -e "require('./apps/vscode-e2e/out/liveHostProtocol.js').prepareLiveSidecar().catch(() => process.exit(1))"
            # Supply reviewed gate-plan/report/receipt/capture files, preserving campaign-relative paths.
            # The artifact must exclude authentication profiles, raw provider logs and workspace contents.
            - name: Download an existing retained campaign
              uses: actions/download-artifact@v7
              with:
                  name: alpha-live-copilot-evidence
                  path: ${{ runner.temp }}/alpha-live-import
                  run-id: ${{ inputs.evidence_run_id }}
                  github-token: ${{ github.token }}
            - name: Recompute live acceptance against the current source and build
              if: always()
              env:
                  ALPHA_LIVE_EVIDENCE_DIR: ${{ runner.temp }}/alpha-live-import
                  ALPHA_LIVE_EVAL_MODEL_ID: ${{ inputs.model_id }}
                  ALPHA_LIVE_EVAL_EFFORT: ${{ inputs.effort }}
              run: node scripts/ci-live-evidence-policy.mjs
            - name: Retain the bounded admission result
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: live-evidence-admission-${{ github.run_id }}-${{ github.run_attempt }}
                  path: artifacts/harness/live-evidence-policy.json
                  retention-days: 14
                  if-no-files-found: error
