name: Code QA Alpha

on:
    workflow_dispatch:
    push:
        branches: [main, main-v2]
    pull_request:
        types: [opened, reopened, ready_for_review, synchronize]
        branches: [main, main-v2]

jobs:
    check-translations:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Verify all translations are complete
              run: node scripts/find-missing-translations.js

    knip:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Run knip checks
              run: pnpm knip

    compile:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Lint
              run: pnpm lint
            - name: Check types
              run: pnpm check-types

    unit-test:
        name: platform-unit-test (${{ matrix.name }})
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      name: ubuntu-latest
                    - os: windows-latest
                      name: windows-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Run unit tests
              run: pnpm test

    vscode-1221-smoke:
        name: VS Code 1.122.1 extension-host contract
        runs-on: windows-latest
        timeout-minutes: 45
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Run offline core confidence and exact-host contracts
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force artifacts/certification | Out-Null
                  pnpm test:core:confidence 2>&1 | Tee-Object -FilePath artifacts/certification/core-confidence.log
                  exit $LASTEXITCODE
            - name: Retain confidence results and failure diagnostics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: core-confidence-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      artifacts/certification/managed-agent-milestone-evidence.json
                      artifacts/certification/core-confidence.log
                      artifacts/core-confidence/*/gate-result.json
                      artifacts/core-confidence/*/prepare-*.json
                      artifacts/core-confidence/*/certification-*.json
                      artifacts/core-confidence/*/*-result.json
                      ${{ runner.temp }}/alpha-core-confidence/*/runs/**
                      ${{ runner.temp }}/alpha-vscode-e2e-*/artifacts/**
                  retention-days: 14
                  if-no-files-found: error
