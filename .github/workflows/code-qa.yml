name: Catalog loading diagnostics (temporary)

on:
    workflow_dispatch:
    push:
        branches: [main]
    pull_request:
        types: [opened, reopened, ready_for_review, synchronize]
        branches: [main]

jobs:
    knip:
        if: github.event_name != 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Run knip checks
              run: pnpm knip

    compile:
        if: github.event_name != 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Build workspace types
              run: pnpm --filter @alpha-code/types build
            - name: Lint and check types through the local harness
              run: pnpm harness run static
            - name: Require current mechanical evidence
              if: always()
              run: pnpm harness matrix --output artifacts/harness/matrix-static.json --require static
            - name: Retain mechanical evidence
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: mechanical-evidence
                  path: artifacts/harness/
                  retention-days: 14

    unit-test:
        if: github.event_name != 'workflow_dispatch'
        name: platform-unit-test (${{ matrix.name }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      name: ubuntu-latest
                    - os: windows-latest
                      name: windows-latest
                    - os: macos-latest
                      name: macos-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Build workspace types
              run: pnpm --filter @alpha-code/types build
            - name: Add bundled ripgrep to PATH
              shell: pwsh
              working-directory: src
              run: node -e "console.log(require('node:path').dirname(require('@vscode/ripgrep').rgPath))" >> $env:GITHUB_PATH
            - name: Run unit tests
              run: pnpm harness run unit
            - name: Run repository and host-runner tooling tests
              run: pnpm harness run tooling
            - name: Record platform execution scope
              if: always()
              run: pnpm harness matrix --output artifacts/harness/matrix-platform.json
            - name: Require complete Linux tooling evidence
              if: always() && matrix.os == 'ubuntu-latest'
              run: pnpm harness matrix --output artifacts/harness/matrix-tooling.json --require tooling
            - name: Retain local command reports
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: local-harness-${{ matrix.name }}
                  path: artifacts/harness/
                  retention-days: 14

    offline-evaluator:
        if: github.event_name != 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup-node-pnpm
            - name: Build workspace types
              run: pnpm --filter @alpha-code/types build
            - run: pnpm harness run offline
            - run: pnpm --filter @alpha-code/evals lint
            - run: pnpm --filter @alpha-code/evals check-types
            - name: Require current offline evaluator evidence
              if: always()
              run: pnpm harness matrix --output artifacts/harness/matrix-offline.json --require offline
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: offline-evaluator
                  path: artifacts/harness/
                  retention-days: 14

    vscode-1380-smoke:
        if: github.event_name != 'workflow_dispatch'
        name: VS Code 1.138.0 extension-host contract
        runs-on: windows-latest
        timeout-minutes: 45
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Build workspace types
              run: pnpm --filter @alpha-code/types build
            - name: Run offline core confidence and exact-host contracts
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force artifacts/certification | Out-Null
                  pnpm harness run confidence 2>&1 | Tee-Object -FilePath artifacts/certification/core-confidence.log
                  exit $LASTEXITCODE
            - name: Require complete confidence evidence
              if: always()
              run: pnpm harness matrix --output artifacts/harness/matrix-confidence.json --require confidence
            - name: Retain confidence results and failure diagnostics
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: core-confidence-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      artifacts/harness/
                      artifacts/certification/managed-agent-milestone-evidence.json
                      artifacts/certification/core-confidence.log
                      artifacts/core-confidence/*/gate-result.json
                      artifacts/core-confidence/*/prepare-*.json
                      artifacts/core-confidence/*/certification-*.json
                      artifacts/core-confidence/*/*-result.json
                      ${{ runner.temp }}/alpha-core-confidence/*/runs/**
                      ${{ runner.temp }}/alpha-vscode-e2e-*/artifacts/**
                  retention-days: 14
                  if-no-files-found: error

    vscode-1380-outcomes:
        if: github.event_name != 'workflow_dispatch'
        name: VS Code 1.138.0 smoke and independent task outcomes
        runs-on: windows-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup-node-pnpm
            - name: Build workspace types
              run: pnpm --filter @alpha-code/types build
            - name: Run the exact reference-host smoke gate
              run: pnpm harness run host
            - name: Verify VS Code 1.125.0 minimum-host compatibility
              run: pnpm --filter @alpha-code/vscode-e2e test:compatibility:1250:run
            - name: Run extended exact-host feature coverage
              run: pnpm harness run extended
            - name: Run independently asserted scripted task outcomes
              run: pnpm harness run outcomes
            - name: Require current host and task evidence
              if: always()
              run: pnpm harness matrix --output artifacts/harness/matrix-outcomes.json --require host --require extended --require outcomes
            - name: Retain projected outcome evidence
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: scripted-outcomes-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      artifacts/harness/
                      ${{ runner.temp }}/alpha-harness-outcomes/*/*/report-*.json
                      ${{ runner.temp }}/alpha-harness-outcomes/*/*/attempt-*/evidence-index.json
                      ${{ runner.temp }}/alpha-harness-outcomes/*/*/host-evidence/**
                      ${{ runner.temp }}/alpha-vscode-e2e-*/artifacts/**
                  retention-days: 14
                  if-no-files-found: error

    catalog-diagnostics:
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout diagnostic branch
              uses: actions/checkout@v5
            - name: Setup pinned Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Build workspace types
              run: pnpm --filter @alpha-code/types build
            - name: Match the normal unit gate bundle preparation
              run: pnpm bundle
            - name: Trace unchanged core assertions on the hosted runner
              shell: pwsh
              env:
                  ALPHA_TRACE_CUSTOM_TOOLS: "1"
              run: |
                  New-Item -ItemType Directory -Force artifacts/harness/release-3.2.7 | Out-Null
                  node -e "const os=require('node:os'); console.log(JSON.stringify({node:process.version,platform:process.platform,cpus:os.availableParallelism()}))"
                  pnpm --filter @alpha-code/core test --reporter=verbose 2>&1 | Tee-Object -FilePath artifacts/harness/release-3.2.7/hosted-core-diagnostics.log
                  exit $LASTEXITCODE
            - name: Retain diagnostic traces
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: catalog-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
                  path: artifacts/harness/release-3.2.7/
                  retention-days: 7
                  if-no-files-found: error
