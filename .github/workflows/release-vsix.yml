name: Release VSIX

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: release-vsix-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release-vsix:
        runs-on: windows-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm

            - name: Create .env file
              shell: pwsh
              run: |
                  "POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}" | Out-File -FilePath .env -Encoding utf8

            - name: Build workspace types
              run: pnpm --filter @alpha-code/types build

            - name: Package extension
              run: pnpm vsix

            - name: Collect release metadata
              id: release
              shell: pwsh
              run: |
                  $version = node -p "require('./src/package.json').version"
                  $shortSha = "${{ github.sha }}".Substring(0, 7)
                  $tag = "vsix-v$version-$shortSha"
                  $vsix = Get-ChildItem -Path bin -Filter "*.vsix" | Select-Object -First 1

                  if (-not $vsix) {
                    throw "No VSIX package found in bin."
                  }

                  "version=$version" >> $env:GITHUB_OUTPUT
                  "short_sha=$shortSha" >> $env:GITHUB_OUTPUT
                  "tag=$tag" >> $env:GITHUB_OUTPUT
                  "vsix_path=$($vsix.FullName)" >> $env:GITHUB_OUTPUT
                  "vsix_name=$($vsix.Name)" >> $env:GITHUB_OUTPUT

            - name: Verify VSIX contents
              shell: pwsh
              run: |
                  $vsix = "${{ steps.release.outputs.vsix_path }}"
                  tar -tf $vsix | Out-File -FilePath vsix-contents.txt -Encoding utf8

                  $requiredFiles = @(
                    "extension/package.json",
                    "extension/package.nls.json",
                    "extension/dist/extension.js",
                    "extension/webview-ui/audio/celebration.wav",
                    "extension/webview-ui/build/assets/index.js",
                    "extension/assets/codicons/codicon.ttf",
                    "extension/assets/vscode-material-icons/icons/3d.svg",
                    ".env"
                  )

                  foreach ($file in $requiredFiles) {
                    if (-not (Select-String -Path vsix-contents.txt -Pattern ([regex]::Escape($file)) -Quiet)) {
                      throw "VSIX is missing required file: $file"
                    }
                  }

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: pwsh
              run: |
                  $tag = "${{ steps.release.outputs.tag }}"
                  $version = "${{ steps.release.outputs.version }}"
                  $shortSha = "${{ steps.release.outputs.short_sha }}"
                  $vsix = "${{ steps.release.outputs.vsix_path }}"
                  $releaseTitle = "Alpha VSIX v$version ($shortSha)"
                  $notes = @"
                  VSIX build from main.

                  Commit: ${{ github.sha }}

                  Download the VSIX asset below and install it in VS Code with:

                  ````bash
                  code --install-extension ${{ steps.release.outputs.vsix_name }}
                  ````
                  "@

                  if (gh release view "$tag" 2>$null) {
                    gh release upload "$tag" "$vsix" --clobber
                  } else {
                    gh release create "$tag" "$vsix" --title "$releaseTitle" --notes "$notes" --target "${{ github.sha }}"
                  }
