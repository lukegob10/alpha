name: Release VSIX

on:
    push:
        branches: [main]
        paths:
            - src/package.json
    workflow_dispatch:

permissions:
    contents: read
    actions: read

concurrency:
    group: release-vsix-${{ github.ref }}
    cancel-in-progress: false

jobs:
    evaluator-contracts:
        uses: ./.github/workflows/evaluation-contracts.yml

    release-vsix:
        needs: evaluator-contracts
        runs-on: windows-latest
        timeout-minutes: 120

        steps:
            # Runner state is unavailable in job-level environment expressions.
            - name: Configure runner temporary directories
              shell: pwsh
              run: |
                  "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
                  "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm

            - name: Build workspace types
              run: pnpm --filter @alpha-code/types build

            - name: Add bundled ripgrep to PATH
              shell: pwsh
              working-directory: src
              run: node -e "console.log(require('node:path').dirname(require('@vscode/ripgrep').rgPath))" >> $env:GITHUB_PATH

            - name: Run mechanical checks
              run: pnpm harness run static

            - name: Run extension and UI unit checks
              run: pnpm harness run unit

            - name: Run runner tooling checks
              run: pnpm harness run tooling

            - name: Run offline evaluator checks
              run: pnpm harness run offline

            - name: Lint evaluator code
              run: pnpm --filter @alpha-code/evals lint

            - name: Check evaluator types
              run: pnpm --filter @alpha-code/evals check-types

            - name: Run exact VS Code 1.138.0 release gate
              run: pnpm harness run host

            - name: Verify VS Code 1.125.0 minimum-host compatibility
              run: pnpm --filter @alpha-code/vscode-e2e test:compatibility:1250:run

            - name: Verify extended exact-host feature coverage
              run: pnpm harness run extended

            - name: Verify managed-agent contracts and certification
              run: pnpm harness run confidence

            - name: Verify rendered composer, transcript and input UI contracts
              run: pnpm harness run rendered

            - name: Verify bounded lifecycle cancellation and managed budgets
              run: pnpm harness run stress

            # Enable after an owned signed-in runner or reviewed local run can supply this commit's retained campaign.
            # Materialize before outcomes captures the compiled harness; later build changes invalidate its evidence.
            - name: Materialize the fixed sidecar manifest for build comparison
              if: vars.ALPHA_REQUIRE_LIVE_EVIDENCE == 'true'
              run: node -e "require('./apps/vscode-e2e/out/liveHostProtocol.js').prepareLiveSidecar().catch(() => process.exit(1))"

            - name: Verify independent scripted task outcomes
              run: pnpm harness run outcomes

            - name: Download explicitly required live Copilot evidence
              if: vars.ALPHA_REQUIRE_LIVE_EVIDENCE == 'true'
              uses: actions/download-artifact@v7
              with:
                  name: alpha-live-copilot-evidence
                  path: ${{ runner.temp }}/alpha-live-import
                  run-id: ${{ vars.ALPHA_LIVE_EVIDENCE_RUN_ID }}
                  github-token: ${{ github.token }}

            - name: Admit fresh source and build bound live Copilot evidence
              if: always() && vars.ALPHA_REQUIRE_LIVE_EVIDENCE == 'true'
              env:
                  ALPHA_LIVE_EVIDENCE_DIR: ${{ runner.temp }}/alpha-live-import
                  ALPHA_LIVE_EVAL_MODEL_ID: ${{ vars.ALPHA_LIVE_EVAL_MODEL_ID }}
                  ALPHA_LIVE_EVAL_EFFORT: ${{ vars.ALPHA_LIVE_EVAL_EFFORT }}
              run: node scripts/ci-live-evidence-policy.mjs

            - name: Record the live evidence operational prerequisite
              if: vars.ALPHA_REQUIRE_LIVE_EVIDENCE != 'true'
              shell: pwsh
              run: |
                  Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'Live Copilot acceptance was not requested. An owned authenticated acquisition path and fresh retained source/build-compatible campaign are required before enabling ALPHA_REQUIRE_LIVE_EVIDENCE. Deterministic release gates remain required.'

            - name: Require current release evidence
              if: always()
              run: pnpm harness matrix --output artifacts/harness/matrix-release.json --require static --require offline --require host --require extended --require confidence --require outcomes --require rendered --require stress

            - name: Verify command auto-approval and outside-path review
              run: pnpm --filter @alpha-code/vscode-e2e test:command-paths:1380:run

            - name: Retain release validation evidence
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      artifacts/harness/
                      artifacts/composer-ui/
                      artifacts/transcript-lifecycle-ui/
                      artifacts/request-user-input-ui/
                      ${{ runner.temp }}/alpha-rendered-probe-*/evidence/**
                      ${{ runner.temp }}/alpha-harness-host-probes-*/evidence-*/**
                      ${{ runner.temp }}/alpha-harness-host-probes-*/ui-probe-*.json
                      artifacts/core-confidence/*/gate-result.json
                      artifacts/core-confidence/*/prepare-*.json
                      artifacts/core-confidence/*/certification-*.json
                      artifacts/core-confidence/*/*-result.json
                      ${{ runner.temp }}/alpha-core-confidence/*/runs/**
                      ${{ runner.temp }}/alpha-harness-outcomes/*/*/report-*.json
                      ${{ runner.temp }}/alpha-harness-outcomes/*/*/attempt-*/evidence-index.json
                      ${{ runner.temp }}/alpha-harness-outcomes/*/*/host-evidence/**
                      ${{ runner.temp }}/alpha-vscode-e2e-*/artifacts/**
                  retention-days: 14
                  if-no-files-found: error

    package-vsix:
        needs: release-vsix
        runs-on: windows-latest
        timeout-minutes: 45
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm

            - name: Package Windows x64
              run: pnpm vsix

            - name: Verify platform inventory and optional backend isolation
              run: pnpm --dir src test __tests__/lancedb-native.spec.mjs services/code-index/vector-store/__tests__/lancedb-loading.spec.ts

            - name: Verify local native indexing
              run: pnpm --dir src test services/code-index/vector-store/__tests__/lancedb-native.spec.ts

            - name: Locate and verify target artifact
              id: artifact
              shell: pwsh
              run: |
                  $version = node -p "require('./src/package.json').version"
                  $vsix = Get-Item -LiteralPath "bin/alpha-$version-win32-x64.vsix" -ErrorAction Stop
                  node scripts/verify-vsix-contents.mjs "$($vsix.FullName)" --check-source --target "win32-x64"
                  if ($LASTEXITCODE -ne 0) { throw "VSIX target verification failed." }
                  "path=$($vsix.FullName)" >> $env:GITHUB_OUTPUT

            - name: Retain verified target artifact
              uses: actions/upload-artifact@v6
              with:
                  name: alpha-vsix-win32-x64
                  path: ${{ steps.artifact.outputs.path }}
                  if-no-files-found: error

    publish-release:
        needs: package-vsix
        runs-on: windows-latest
        timeout-minutes: 15
        permissions:
            contents: write
        steps:
            - name: Checkout release metadata
              uses: actions/checkout@v5

            - name: Download verified Windows x64 artifact
              uses: actions/download-artifact@v7
              with:
                  name: alpha-vsix-win32-x64
                  path: bin

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: pwsh
              run: |
                  $version = (Get-Content -LiteralPath src/package.json -Raw | ConvertFrom-Json).version
                  $shortSha = "${{ github.sha }}".Substring(0, 7)
                  $tag = "vsix-v$version-$shortSha"
                  $targets = @("win32-x64")
                  $vsixPaths = @($targets | ForEach-Object {
                    (Get-Item -LiteralPath "bin/alpha-$version-$_.vsix" -ErrorAction Stop).FullName
                  })
                  if (@(Get-ChildItem -LiteralPath bin -Filter *.vsix).Count -ne $targets.Count) {
                    throw "Release must contain exactly one Windows x64 VSIX."
                  }
                  $releaseTitle = "Alpha VSIX v$version ($shortSha)"
                  $changelog = Get-Content -LiteralPath CHANGELOG.md -Raw
                  $versionHeading = [regex]::Escape("## $version")
                  $entry = [regex]::Match($changelog, "(?ms)^$versionHeading\r?\n(?<body>.*?)(?=^## |\z)")
                  if (-not $entry.Success -or [string]::IsNullOrWhiteSpace($entry.Groups["body"].Value)) {
                    throw "No changelog entry found for release version $version."
                  }
                  $highlights = $entry.Groups["body"].Value.Trim()
                  $notes = @"
                  $highlights

                  Commit: ${{ github.sha }}

                  Download the Windows x64 VSIX for Intel/AMD PCs. Install it with: code --install-extension alpha-$version.vsix
                  "@

                  gh release view "$tag" --json tagName 2>$null
                  if ($LASTEXITCODE -eq 0) {
                    throw "Release $tag already exists; refusing to overwrite its published artifacts."
                  }
                  $releaseAsset = Join-Path -Path (Resolve-Path -LiteralPath bin).Path -ChildPath "alpha-$version.vsix"
                  Move-Item -LiteralPath $vsixPaths[0] -Destination $releaseAsset -ErrorAction Stop
                  gh release create "$tag" "$releaseAsset" --title "$releaseTitle" --notes "$notes" --target "${{ github.sha }}"
                  if ($LASTEXITCODE -ne 0) { throw "Release creation failed." }
