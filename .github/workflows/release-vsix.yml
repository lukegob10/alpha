name: Release VSIX

on:
    push:
        branches: [main]
        paths:
            - src/package.json
    workflow_dispatch:
        inputs:
            quality_evidence_run_id:
                description: "Successful one-provider live smoke evidence review for this commit (required for agent changes)"
                type: string
                required: false

permissions:
    contents: read

concurrency:
    group: release-vsix-${{ github.ref }}
    cancel-in-progress: false

jobs:
    validation:
        name: Release validation (${{ matrix.lane }})
        needs: live-quality
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { lane: static, os: windows-latest }
                    - { lane: turns, os: windows-latest }
                    - { lane: unit, os: windows-latest }
                    - { lane: tooling, os: windows-latest }
                    - { lane: offline, os: windows-latest }
                    - { lane: host, os: windows-latest }
                    - { lane: minimum, os: windows-latest }
                    - { lane: extended, os: windows-latest }
                    - { lane: confidence, os: windows-latest }
                    - { lane: rendered, os: windows-latest }
                    - { lane: stress, os: windows-latest }
                    - { lane: outcomes, os: windows-latest }
                    - { lane: command-approval, os: windows-latest }
        steps:
            - name: Configure runner temporary directories
              shell: pwsh
              run: |
                  "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
                  "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
            - name: Checkout code
              uses: actions/checkout@v5
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Build workspace types
              run: pnpm --filter @alpha-code/types build
            - name: Add bundled ripgrep to PATH
              shell: pwsh
              working-directory: src
              run: node -e "console.log(require('node:path').dirname(require('@vscode/ripgrep').rgPath))" >> $env:GITHUB_PATH
            - name: Run the complete existing validation lane
              run: pnpm harness run "${{ matrix.lane }}"
            - name: Lint evaluator code
              if: matrix.lane == 'offline'
              run: pnpm --filter @alpha-code/evals lint
            - name: Check evaluator types
              if: matrix.lane == 'offline'
              run: pnpm --filter @alpha-code/evals check-types
            - name: Bind the job to its source and harness evidence
              if: ${{ always() }}
              run: pnpm exec node scripts/harness/release-evidence.mjs record-validation --lane "${{ matrix.lane }}" --output "artifacts/harness/release-validation-${{ matrix.lane }}.json"
            - name: Retain validation evidence and failure diagnostics
              if: ${{ always() }}
              uses: actions/upload-artifact@v6
              with:
                  name: release-validation-${{ matrix.lane }}-${{ github.run_attempt }}
                  path: artifacts/harness/
                  if-no-files-found: error
                  retention-days: 14

    live-quality:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            actions: read
        env:
            QUALITY_EVIDENCE_RUN_ID: ${{ inputs.quality_evidence_run_id }}
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - uses: ./.github/actions/setup-node-pnpm
            - name: Determine whether agent behavior changed since the last release
              id: policy
              run: node scripts/harness/release-quality.mjs policy --candidate "$GITHUB_SHA"
            - name: Require a successful live smoke review for the candidate commit
              if: steps.policy.outputs.required != 'false'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: node scripts/harness/release-quality.mjs verify-run --run-id "$QUALITY_EVIDENCE_RUN_ID" --candidate "$GITHUB_SHA"
            - name: Download the reviewed live smoke evidence
              if: steps.policy.outputs.required != 'false'
              uses: actions/download-artifact@v7
              with:
                  name: live-quality-evidence-${{ github.sha }}
                  path: ${{ runner.temp }}/live-quality-evidence
                  run-id: ${{ inputs.quality_evidence_run_id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
            - name: Recheck the reviewed real extension live task
              if: steps.policy.outputs.required != 'false'
              run: node scripts/harness/release-quality.mjs verify-smoke --input "$RUNNER_TEMP/live-quality-evidence/bundle.json" --candidate "$GITHUB_SHA" --output "$RUNNER_TEMP/live-quality-evidence/release-smoke.json"
            - name: Retain the live smoke review
              if: steps.policy.outputs.required != 'false'
              uses: actions/upload-artifact@v6
              with:
                  name: live-quality-release-${{ github.sha }}
                  path: ${{ runner.temp }}/live-quality-evidence/release-smoke.json
                  if-no-files-found: error
                  retention-days: 14

    package-vsix:
        needs: live-quality
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        strategy:
            fail-fast: false
            max-parallel: 6
            matrix:
                # Runner architectures verified on 2026-10-27:
                # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
                include:
                    - os: windows-latest
                      target: win32-x64
                      native_index: true
                    - os: windows-11-arm
                      target: win32-arm64
                      native_index: true
                    # macos-14 retires November 2; use GitHub's supported arm64 replacement.
                    # https://github.blog/changelog/2026-10-01-github-actions-macos-14-runner-image-retirement/
                    - os: macos-15
                      target: darwin-arm64
                      native_index: true
                    # LanceDB 0.27.2 has no Intel macOS native package; core features remain supported.
                    - os: macos-15-intel
                      target: darwin-x64
                      native_index: false
                    - os: ubuntu-latest
                      target: linux-x64
                      native_index: true
                    - os: ubuntu-24.04-arm
                      target: linux-arm64
                      native_index: true
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm

            - name: Package the native host target
              run: pnpm vsix

            - name: Verify platform inventory and optional backend isolation
              run: pnpm --dir src test __tests__/lancedb-native.spec.mjs services/code-index/vector-store/__tests__/lancedb-loading.spec.ts

            - name: Verify local native indexing
              if: matrix.native_index
              run: pnpm --dir src test services/code-index/vector-store/__tests__/lancedb-native.spec.ts

            - name: Locate and verify target artifact
              id: artifact
              shell: pwsh
              run: |
                  $version = node -p "require('./src/package.json').version"
                  $vsix = Get-Item -LiteralPath "bin/alpha-$version-${{ matrix.target }}.vsix" -ErrorAction Stop
                  node scripts/verify-vsix-contents.mjs "$($vsix.FullName)" --check-source --require-clean-build --target "${{ matrix.target }}"
                  if ($LASTEXITCODE -ne 0) { throw "VSIX target verification failed." }
                  "path=$($vsix.FullName)" >> $env:GITHUB_OUTPUT

            - name: Bind native package bytes and clean build provenance
              run: pnpm exec node scripts/harness/release-evidence.mjs record-package --target "${{ matrix.target }}" --vsix "${{ steps.artifact.outputs.path }}" --output "${{ steps.artifact.outputs.path }}.evidence.json"

            - name: Retain verified target artifact
              uses: actions/upload-artifact@v6
              with:
                  name: alpha-vsix-${{ matrix.target }}-${{ github.run_attempt }}
                  path: |
                      ${{ steps.artifact.outputs.path }}
                      ${{ steps.artifact.outputs.path }}.evidence.json
                  if-no-files-found: error

    # Always evaluate failures/skips; only a passing barrier can enable publication.
    release-gate:
        if: ${{ always() }}
        needs: [live-quality, validation, package-vsix]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout evidence contracts
              uses: actions/checkout@v5
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Build workspace types
              run: pnpm --filter @alpha-code/types build
            - name: Download this attempt's validation evidence
              if: needs.validation.result == 'success'
              uses: actions/download-artifact@v7
              with:
                  pattern: release-validation-*-${{ github.run_attempt }}
                  path: artifacts/release-input/validation
            - name: Download this attempt's native packages and receipts
              if: needs.package-vsix.result == 'success'
              uses: actions/download-artifact@v7
              with:
                  pattern: alpha-vsix-*-${{ github.run_attempt }}
                  path: bin
                  merge-multiple: true
            - name: Require every job, harness contract and package identity
              if: ${{ always() }}
              env:
                  RELEASE_NEEDS: ${{ toJSON(needs) }}
              run: pnpm exec node scripts/harness/release-evidence.mjs aggregate --validation-root artifacts/release-input/validation --packages bin --output artifacts/harness/release-gate.json
            - name: Retain the complete publication barrier
              if: ${{ always() }}
              uses: actions/upload-artifact@v6
              with:
                  name: release-barrier-${{ github.sha }}-${{ github.run_attempt }}
                  path: artifacts/harness/release-gate.json
                  if-no-files-found: error
                  retention-days: 14

    publish-release:
        needs: [live-quality, validation, package-vsix, release-gate]
        if: ${{ needs.live-quality.result == 'success' && needs.validation.result == 'success' && needs.package-vsix.result == 'success' && needs.release-gate.result == 'success' }}
        runs-on: windows-latest
        timeout-minutes: 15
        permissions:
            contents: write
        steps:
            - name: Checkout release metadata
              uses: actions/checkout@v5

            - name: Verify release tag source
              env:
                  ALPHA_RELEASE_SHA: ${{ github.sha }}
              shell: pwsh
              run: |
                  $expected = $env:ALPHA_RELEASE_SHA
                  if ($expected -notmatch '^[a-f0-9]{40}$') { throw "Release tag source must be a full commit SHA." }
                  $version = (Get-Content -LiteralPath src/package.json -Raw | ConvertFrom-Json).version
                  $tag = "vsix-v$version-$($expected.Substring(0, 7))"
                  git ls-remote --exit-code --refs --tags origin "refs/tags/$tag" > $null
                  if ($LASTEXITCODE -eq 2) { exit 0 }
                  if ($LASTEXITCODE -ne 0) { throw "Could not verify the remote release tag." }
                  git fetch --no-tags --quiet origin "refs/tags/$tag"
                  if ($LASTEXITCODE -ne 0) { throw "Could not fetch the remote release tag." }
                  $actual = git rev-parse --verify 'FETCH_HEAD^{commit}'
                  if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) {
                    throw "Release tag $tag does not identify the source commit $expected."
                  }

            - name: Download verified target artifacts
              uses: actions/download-artifact@v7
              with:
                  pattern: alpha-vsix-*-${{ github.run_attempt }}
                  path: bin
                  merge-multiple: true

            - name: Download the passing publication barrier
              uses: actions/download-artifact@v7
              with:
                  name: release-barrier-${{ github.sha }}-${{ github.run_attempt }}
                  path: artifacts/harness

            - name: Recheck publication source, attempt and package bytes
              env:
                  RELEASE_NEEDS: ${{ toJSON(needs) }}
              run: node scripts/harness/release-evidence.mjs verify-publication --input artifacts/harness/release-gate.json --packages bin

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: pwsh
              run: |
                  $version = (Get-Content -LiteralPath src/package.json -Raw | ConvertFrom-Json).version
                  $shortSha = "${{ github.sha }}".Substring(0, 7)
                  $tag = "vsix-v$version-$shortSha"
                  $targets = @("win32-x64", "win32-arm64", "darwin-arm64", "darwin-x64", "linux-x64", "linux-arm64")
                  $vsixPaths = @($targets | ForEach-Object {
                    (Get-Item -LiteralPath "bin/alpha-$version-$_.vsix" -ErrorAction Stop).FullName
                  })
                  if (@(Get-ChildItem -LiteralPath bin -Filter *.vsix).Count -ne $targets.Count) {
                    throw "Release artifacts differ from the supported platform matrix."
                  }
                  $releaseTitle = "Alpha VSIX v$version ($shortSha)"
                  $changelog = Get-Content -LiteralPath CHANGELOG.md -Raw
                  $versionHeading = [regex]::Escape("## $version")
                  $entry = [regex]::Match($changelog, "(?ms)^$versionHeading\r?\n(?<body>.*?)(?=^## |\z)")
                  if (-not $entry.Success -or [string]::IsNullOrWhiteSpace($entry.Groups["body"].Value)) {
                    throw "No changelog entry found for release version $version."
                  }
                  $highlights = $entry.Groups["body"].Value.Trim()
                  $notes = @"
                  $highlights

                  Commit: ${{ github.sha }}

                  Download the VSIX for your operating system and architecture. Install it with: code --install-extension <downloaded-file.vsix>
                  Intel macOS supports core features; select Qdrant for code indexing because this LanceDB version has no Intel macOS binding.
                  "@

                  gh release view "$tag" --json tagName 2>$null
                  if ($LASTEXITCODE -eq 0) {
                    throw "Release $tag already exists; refusing to overwrite its published artifacts."
                  }
                  gh release create "$tag" @vsixPaths --title "$releaseTitle" --notes "$notes" --target "${{ github.sha }}"
                  if ($LASTEXITCODE -ne 0) { throw "Release creation failed." }
