name: Release VSIX

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: release-vsix-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release-vsix:
        runs-on: windows-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm

            - name: Build workspace types
              run: pnpm --filter @alpha-code/types build

            - name: Run exact VS Code 1.122.1 release gate
              run: pnpm --filter @alpha-code/vscode-e2e test:smoke:1221

            - name: Verify command auto-approval and outside-path review
              run: pnpm --filter @alpha-code/vscode-e2e test:command-paths:1221:run

            - name: Package extension
              run: pnpm vsix

            - name: Collect release metadata
              id: release
              shell: pwsh
              run: |
                  $version = node -p "require('./src/package.json').version"
                  $shortSha = "${{ github.sha }}".Substring(0, 7)
                  $tag = "vsix-v$version-$shortSha"
                  $vsix = Get-Item -LiteralPath "bin/alpha-$version.vsix" -ErrorAction Stop

                  if (-not $vsix) {
                    throw "No VSIX package found in bin."
                  }

                  "version=$version" >> $env:GITHUB_OUTPUT
                  "short_sha=$shortSha" >> $env:GITHUB_OUTPUT
                  "tag=$tag" >> $env:GITHUB_OUTPUT
                  "vsix_path=$($vsix.FullName)" >> $env:GITHUB_OUTPUT
                  "vsix_name=$($vsix.Name)" >> $env:GITHUB_OUTPUT

            - name: Verify VSIX contents
              run: node scripts/verify-vsix-contents.mjs "${{ steps.release.outputs.vsix_path }}" --check-source

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: pwsh
              run: |
                  $tag = "${{ steps.release.outputs.tag }}"
                  $version = "${{ steps.release.outputs.version }}"
                  $shortSha = "${{ steps.release.outputs.short_sha }}"
                  $vsix = "${{ steps.release.outputs.vsix_path }}"
                  $releaseTitle = "Alpha VSIX v$version ($shortSha)"
                  $notes = @"
                  VSIX build from main.

                  Commit: ${{ github.sha }}

                  Download the VSIX asset below and install it in VS Code with:

                  ````bash
                  code --install-extension ${{ steps.release.outputs.vsix_name }}
                  ````
                  "@

                  gh release view "$tag" --json tagName 2>$null
                  if ($LASTEXITCODE -eq 0) {
                    throw "Release $tag already exists; refusing to overwrite its published artifact."
                  }
                  gh release create "$tag" "$vsix" --title "$releaseTitle" --notes "$notes" --target "${{ github.sha }}"
                  if ($LASTEXITCODE -ne 0) {
                    throw "Release creation failed."
                  }
