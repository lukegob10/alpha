name: Release V2 Preview VSIX

on:
    push:
        branches: [main-v2]
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: release-vsix-v2-preview-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release-vsix-v2-preview:
        runs-on: windows-latest
        timeout-minutes: 90

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm

            - name: Build workspace types
              run: pnpm --filter @alpha-code/types build

            - name: Add bundled ripgrep to PATH
              shell: pwsh
              working-directory: src
              run: node -e "console.log(require('node:path').dirname(require('@vscode/ripgrep').rgPath))" >> $env:GITHUB_PATH

            - name: Run mechanical checks
              run: pnpm harness run static

            - name: Run extension and UI unit checks
              run: pnpm harness run unit

            - name: Run runner tooling checks
              run: pnpm harness run tooling

            - name: Run offline evaluator checks
              run: pnpm harness run offline

            - name: Lint evaluator code
              run: pnpm --filter @alpha-code/evals lint

            - name: Check evaluator types
              run: pnpm --filter @alpha-code/evals check-types

            - name: Run exact VS Code 1.125.0 release gate
              run: pnpm harness run host

            - name: Verify managed-agent contracts and certification
              run: pnpm harness run confidence

            - name: Verify independent scripted task outcomes
              run: pnpm harness run outcomes

            - name: Require current release evidence
              if: always()
              run: pnpm harness matrix --output artifacts/harness/matrix-release.json --require static --require offline --require host --require confidence --require outcomes

            - name: Verify global command auto-approval and outside-path review
              run: pnpm --filter @alpha-code/vscode-e2e test:command-paths:1250:run

            - name: Package extension
              shell: pwsh
              run: |
                  $version = node -p "require('./src/package.json').version"
                  New-Item -ItemType Directory -Force -Path bin | Out-Null
                  pnpm --dir src exec vsce package --no-dependencies --pre-release --out "../bin/alpha-$version.vsix"
                  if ($LASTEXITCODE -ne 0) {
                    throw "Preview VSIX packaging failed."
                  }

            - name: Collect preview metadata
              id: release
              shell: pwsh
              run: |
                  $version = node -p "require('./src/package.json').version"
                  $shortSha = "${{ github.sha }}".Substring(0, 7)
                  $tag = "vsix-v2-preview-$version-$shortSha"
                  $vsix = Get-Item -LiteralPath "bin/alpha-$version.vsix" -ErrorAction Stop

                  "version=$version" >> $env:GITHUB_OUTPUT
                  "short_sha=$shortSha" >> $env:GITHUB_OUTPUT
                  "tag=$tag" >> $env:GITHUB_OUTPUT
                  "vsix_path=$($vsix.FullName)" >> $env:GITHUB_OUTPUT
                  "vsix_name=$($vsix.Name)" >> $env:GITHUB_OUTPUT

            - name: Verify VSIX contents
              run: node scripts/verify-vsix-contents.mjs "${{ steps.release.outputs.vsix_path }}" --check-source

            - name: Create GitHub prerelease
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: pwsh
              run: |
                  $tag = "${{ steps.release.outputs.tag }}"
                  $version = "${{ steps.release.outputs.version }}"
                  $shortSha = "${{ steps.release.outputs.short_sha }}"
                  $vsix = "${{ steps.release.outputs.vsix_path }}"
                  $releaseTitle = "Alpha V2 Preview v$version ($shortSha)"
                  $changelog = Get-Content -LiteralPath src/CHANGELOG.md -Raw
                  $versionHeading = [regex]::Escape("## $version")
                  $entry = [regex]::Match($changelog, "(?ms)^$versionHeading\r?\n(?<body>.*?)(?=^## |\z)")
                  if (-not $entry.Success -or [string]::IsNullOrWhiteSpace($entry.Groups["body"].Value)) {
                    throw "No changelog entry found for preview version $version."
                  }
                  $highlights = $entry.Groups["body"].Value.Trim()
                  $notes = @"
                  Preview VSIX build from main-v2. This is not published to the VS Code Marketplace.

                  $highlights

                  Commit: ${{ github.sha }}

                  Test this build in an isolated VS Code profile or extension directory. Installing it over the stable
                  extension replaces that installation because both channels intentionally share the production extension ID.
                  If another v$version preview is already installed, use --force to replace the same-version build.

                  Install command: code --install-extension ${{ steps.release.outputs.vsix_name }} --force
                  "@

                  gh release view "$tag" --json tagName 2>$null
                  if ($LASTEXITCODE -eq 0) {
                    throw "Preview release $tag already exists; refusing to overwrite its published artifact."
                  }
                  gh release create "$tag" "$vsix" --prerelease --latest=false --title "$releaseTitle" --notes "$notes" --target "${{ github.sha }}"
                  if ($LASTEXITCODE -ne 0) {
                    throw "Preview release creation failed."
                  }

            - name: Retain preview validation evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: preview-evidence-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      artifacts/harness/
                      artifacts/core-confidence/*/gate-result.json
                      artifacts/core-confidence/*/prepare-*.json
                      artifacts/core-confidence/*/certification-*.json
                      artifacts/core-confidence/*/*-result.json
                      ${{ runner.temp }}/alpha-core-confidence/*/runs/**
                      ${{ runner.temp }}/alpha-harness-outcomes/*/*/report-*.json
                      ${{ runner.temp }}/alpha-harness-outcomes/*/*/attempt-*/evidence-index.json
                      ${{ runner.temp }}/alpha-harness-outcomes/*/*/host-evidence/**
                      ${{ runner.temp }}/alpha-vscode-e2e-*/artifacts/**
                  retention-days: 14
                  if-no-files-found: error
